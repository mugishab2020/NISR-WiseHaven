name: CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "wisehaven/**"
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "wisehaven/**"
      - "backend/**"
      - ".github/workflows/ci.yml"

jobs:
  # ── Frontend: Lint ────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisehaven
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: wisehaven/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ── Frontend: Type Check ─────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisehaven
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: wisehaven/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ── Frontend: Build ───────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    defaults:
      run:
        working-directory: wisehaven
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: wisehaven/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: wisehaven/.next/
          retention-days: 3

  # ── Backend: Test ─────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wisehaven
          POSTGRES_PASSWORD: wisehaven
          POSTGRES_DB: wisehaven_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend/wisehaven_backend

    env:
      DATABASE_URL: postgresql://wisehaven:wisehaven@localhost:5432/wisehaven_test
      # Tests use synthetic HS256 JWT tokens with the fallback JWT decoder.
      # No real Clerk key is required for the test suite to pass.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_placeholder_for_ci' }}
      ENVIRONMENT: test
      RATE_LIMIT_PER_MINUTE: "1000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/wisehaven_backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate Prisma client
        run: prisma generate --schema=models/schema.prisma

      - name: Run database migrations
        run: prisma migrate deploy --schema=models/schema.prisma

      - name: Run pytest
        run: pytest tests/test_api.py -v --tb=short
