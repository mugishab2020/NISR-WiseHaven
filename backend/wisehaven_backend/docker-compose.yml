version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wisehaven-postgres
    environment:
      POSTGRES_USER: wisehaven
      POSTGRES_PASSWORD: wisehaven123
      POSTGRES_DB: wisehaven
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisehaven"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
