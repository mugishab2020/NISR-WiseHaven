services:
  - type: web
    name: wisehaven-backend
    env: python
    region: oregon
    rootDir: backend/wisehaven_backend
    buildCommand: bash render-build.sh
    startCommand: bash start-server.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://nisr-wise-haven.vercel.app,http://localhost:3000,http://127.0.0.1:3000
      - key: LOG_LEVEL
        value: INFO
