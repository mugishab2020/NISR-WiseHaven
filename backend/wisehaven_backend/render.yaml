services:
  - type: web
    name: wisehaven-backend
    env: python
    region: oregon
    rootDir: backend/wisehaven_backend
    buildCommand: pip install -r requirements.txt && prisma generate --schema models/schema.prisma && prisma py fetch
    startCommand: bash start-server.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: wisehaven-db
          property: connectionString
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: wisehaven-db
    databaseName: wisehaven
    user: wisehaven
    region: oregon
